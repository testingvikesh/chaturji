<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1a367c">
    <title>Offline - Gses Chaturji</title>
    <style>
        :root { color-scheme: dark; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Outfit, Figtree, ui-sans-serif, system-ui, sans-serif;
            background: linear-gradient(160deg, #0d1f4a 0%, #1a367c 55%, #2a4a9a 100%);
            color: #fff;
            text-align: center;
            padding: 24px;
        }
        .card {
            max-width: 360px;
        }
        img {
            width: 88px;
            height: 88px;
            object-fit: contain;
            margin-bottom: 16px;
        }
        h1 {
            margin: 0 0 8px;
            font-size: 1.6rem;
        }
        p {
            margin: 0 0 24px;
            color: rgba(255,255,255,.75);
            line-height: 1.5;
        }
        button {
            border: 0;
            border-radius: 12px;
            padding: 12px 22px;
            font-weight: 700;
            background: #d4af37;
            color: #0d1f4a;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="images/brand/logo.png" alt="Gses Chaturji">
        <h1>You are offline</h1>
        <p>Check your internet connection and try again to open Gses Chaturji.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
